name: Manual Deploy

# Deploy the latest released version to the VPS without rebuilding.
# Intentionally NOT triggered by pushes — run it from the Actions tab
# whenever you want the server to pick up the newest released image.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: latest GitHub release)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to VPS
    environment: production

    steps:
      - name: 🔑 Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No VPS secrets found, skipping deployment"
          fi

      - name: 📥 Checkout
        if: steps.check.outputs.has_secrets == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve the tag to deploy: explicit input wins, otherwise use the
      # newest non-prerelease GitHub release tag (the "last version").
      - name: 🏷️ Resolve release tag
        id: tag
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | grep '"tag_name"' | head -1 | sed 's/.*: "//; s/",*//')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "❌ No GitHub releases found — create a release first or pass a tag input."
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "✅ Deploying image tag: ${TAG}"

      - name: 🔑 Setup SSH
        if: steps.check.outputs.has_secrets == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🔗 Add host key
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via Docker
        if: steps.check.outputs.has_secrets == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BASE_DOWNLOAD_LINK: ${{ secrets.BASE_DOWNLOAD_LINK }}
          WHITELIST_USERS: ${{ secrets.WHITELIST_USERS || '' }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS || '' }}
          STORAGE_DAYS: ${{ vars.STORAGE_DAYS || '2' }}
          COOKIE_TTL_HOURS: ${{ vars.COOKIE_TTL_HOURS || '0' }}
          MAX_TELEGRAM_SIZE_MB: ${{ vars.MAX_TELEGRAM_SIZE_MB || '2048' }}
          USE_WARP: ${{ secrets.USE_WARP || 'false' }}
          MIN_DISK_FREE_MB: ${{ vars.MIN_DISK_FREE_MB || '1024' }}
          AAC_TRANSCODE: ${{ vars.AAC_TRANSCODE || 'true' }}
          MAX_COMMENTS: ${{ vars.MAX_COMMENTS || '0' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: |
          DEPLOY_DIR="/opt/telegram-yt-bot"
          CONTAINER="youtube-bot"
          IMAGE_NAME="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${TAG}"
          echo "IMAGE_NAME=${IMAGE_NAME}"
          echo "IMAGE_TAG=${IMAGE_TAG}"

          # Create .env locally (secrets available here)
          cat > /tmp/.env
          printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN" > /tmp/.env
          printf 'BASE_DOWNLOAD_LINK=%s\n' "$BASE_DOWNLOAD_LINK" >> /tmp/.env
          printf 'WHITELIST_USERS=%s\n' "$WHITELIST_USERS" >> /tmp/.env
          printf 'ADMIN_USERS=%s\n' "$ADMIN_USERS" >> /tmp/.env
          printf 'STORAGE_DAYS=%s\n' "$STORAGE_DAYS" >> /tmp/.env
          printf 'COOKIE_TTL_HOURS=%s\n' "$COOKIE_TTL_HOURS" >> /tmp/.env
          printf 'MAX_TELEGRAM_FILE_SIZE=%s\n' "$MAX_TELEGRAM_SIZE_MB" >> /tmp/.env
          printf 'USE_WARP=%s\n' "$USE_WARP" >> /tmp/.env
          printf 'MIN_DISK_FREE_MB=%s\n' "$MIN_DISK_FREE_MB" >> /tmp/.env
          printf 'AAC_TRANSCODE=%s\n' "$AAC_TRANSCODE" >> /tmp/.env
          printf 'MAX_COMMENTS=%s\n' "$MAX_COMMENTS" >> /tmp/.env
          printf 'LOG_LEVEL=%s\n' "$LOG_LEVEL" >> /tmp/.env

          # Create docker-compose.yml locally using printf with placeholder
          printf 'services:\n' > /tmp/docker-compose.yml
          printf '  bot:\n' >> /tmp/docker-compose.yml
          printf '    image: IMAGE_PLACEHOLDER\n' >> /tmp/docker-compose.yml
          printf '    container_name: %s\n' "$CONTAINER" >> /tmp/docker-compose.yml
          printf '    restart: unless-stopped\n' >> /tmp/docker-compose.yml
          printf '    env_file:\n' >> /tmp/docker-compose.yml
          printf '      - .env\n' >> /tmp/docker-compose.yml
          printf '    ports:\n' >> /tmp/docker-compose.yml
          printf '      - "8000:8000"\n' >> /tmp/docker-compose.yml
          printf '    volumes:\n' >> /tmp/docker-compose.yml
          printf '      - ./data:/app/data\n' >> /tmp/docker-compose.yml
          printf '      - ./downloads:/app/downloads\n' >> /tmp/docker-compose.yml
          printf '      - ./ssl:/app/ssl\n' >> /tmp/docker-compose.yml

          # Replace placeholder with actual image on VPS
          FULL_IMAGE="ghcr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Full image: ${FULL_IMAGE}"

          # Install Docker if not present
          ssh -p 22 root@${VPS_HOST} "command -v docker || (curl -fsSL https://get.docker.com | sh)"

          # Create deploy directory
          ssh -p 22 root@${VPS_HOST} "mkdir -p ${DEPLOY_DIR}/{data,downloads,ssl}"

          # Copy files to VPS
          scp -P 22 /tmp/.env root@${VPS_HOST}:${DEPLOY_DIR}/.env
          scp -P 22 /tmp/docker-compose.yml root@${VPS_HOST}:${DEPLOY_DIR}/docker-compose.yml
          ssh -p 22 root@${VPS_HOST} "chmod 600 ${DEPLOY_DIR}/.env"

          # Replace placeholder with actual image on VPS
          ssh -p 22 root@${VPS_HOST} "sed -i 's|IMAGE_PLACEHOLDER|${FULL_IMAGE}|g' ${DEPLOY_DIR}/docker-compose.yml"

          # Validate token
          ssh -p 22 root@${VPS_HOST} "grep -q '^BOT_TOKEN=$' ${DEPLOY_DIR}/.env && echo '❌ BOT_TOKEN is empty!' && exit 1 || echo '✅ BOT_TOKEN is set'"

          # Pull and restart
          ssh -p 22 root@${VPS_HOST} "cd ${DEPLOY_DIR} && docker compose pull && docker compose up -d --remove-orphans"

          # Clean old images
          ssh -p 22 root@${VPS_HOST} "docker image prune -f"

          # Verify
          sleep 10
          ssh -p 22 root@${VPS_HOST} "docker ps --filter 'name=${CONTAINER}' --filter 'status=running' | grep -q ${CONTAINER} && echo '✅ Container is running!' && docker logs --tail=10 ${CONTAINER} || (echo '❌ Container failed!' && docker logs --tail=30 ${CONTAINER} && exit 1)"