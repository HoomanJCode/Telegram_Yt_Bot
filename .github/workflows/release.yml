name: Release & Deploy

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  # ──────────────────────────────────────────────
  # 1. Run tests
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    name: 🧪 Test
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 📦 Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: 🧪 Run tests
        run: python -m unittest discover tests -v

  # ──────────────────────────────────────────────
  # 2. Build and push Docker image to GHCR
  # ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    name: 🐳 Build Docker Image
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────
  # 3. Create GitHub Release with changelog
  # ──────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    name: 📝 Create Release
    needs: docker
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -A1 "^${TAG}$" | tail -1)

          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG")
            {
              echo "body<<EOF"
              echo "## What's Changed"
              echo ""
              echo "$LOG"
              echo ""
              echo "## Docker"
              echo ""
              echo "\`\`\`bash"
              echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${TAG}"
              echo "\`\`\`"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

  # ──────────────────────────────────────────────
  # 4. Deploy to VPS (only if secrets exist)
  # ──────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to VPS
    needs: docker
    environment: production

    steps:
      - name: 🔑 Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No VPS secrets found, skipping deployment"
          fi

      - name: 🔑 Setup SSH
        if: steps.check.outputs.has_secrets == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🔗 Add host key
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via Docker
        if: steps.check.outputs.has_secrets == 'true'
        env:
          TAG: ${{ github.ref_name }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BASE_DOWNLOAD_LINK: ${{ secrets.BASE_DOWNLOAD_LINK }}
          WHITELIST_USERS: ${{ secrets.WHITELIST_USERS || '' }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS || '' }}
          STORAGE_DAYS: ${{ vars.STORAGE_DAYS || '2' }}
          COOKIE_TTL_HOURS: ${{ vars.COOKIE_TTL_HOURS || '0' }}
          MAX_TELEGRAM_SIZE_MB: ${{ vars.MAX_TELEGRAM_SIZE_MB || '50' }}
          USE_WARP: ${{ secrets.USE_WARP || 'false' }}
          MIN_DISK_FREE_MB: ${{ vars.MIN_DISK_FREE_MB || '1024' }}
          AAC_TRANSCODE: ${{ vars.AAC_TRANSCODE || 'true' }}
          MAX_COMMENTS: ${{ vars.MAX_COMMENTS || '0' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: |
          DEPLOY_DIR="/opt/telegram-yt-bot"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower]'):${TAG}"
          CONTAINER="youtube-bot"

          # Create .env file locally, then copy to VPS
          cat > /tmp/.env << EOF
          BOT_TOKEN=${BOT_TOKEN}
          BASE_DOWNLOAD_LINK=${BASE_DOWNLOAD_LINK}
          WHITELIST_USERS=${WHITELIST_USERS}
          ADMIN_USERS=${ADMIN_USERS}
          STORAGE_DAYS=${STORAGE_DAYS}
          COOKIE_TTL_HOURS=${COOKIE_TTL_HOURS}
          MAX_TELEGRAM_FILE_SIZE=${MAX_TELEGRAM_SIZE_MB}
          USE_WARP=${USE_WARP}
          MIN_DISK_FREE_MB=${MIN_DISK_FREE_MB}
          AAC_TRANSCODE=${AAC_TRANSCODE}
          MAX_COMMENTS=${MAX_COMMENTS}
          LOG_LEVEL=${LOG_LEVEL}
          EOF

          # Create deploy script
          cat > /tmp/deploy.sh << SCRIPTEOF
          #!/bin/bash
          set -e

          echo "========================================"
          echo "  Deploying ${IMAGE}"
          echo "========================================"

          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
            echo "📦 Installing Docker..."
            curl -fsSL https://get.docker.com | sh
          fi

          # Create project directory
          mkdir -p ${DEPLOY_DIR}/{data,downloads,ssl}

          # Validate token
          if grep -q "^BOT_TOKEN=$" /tmp/.env 2>/dev/null; then
            echo "❌ ERROR: BOT_TOKEN is empty!"
            exit 1
          fi

          # Create docker-compose.yml
          cat > ${DEPLOY_DIR}/docker-compose.yml << EOF
          services:
            bot:
              image: ${IMAGE}
              container_name: ${CONTAINER}
              restart: unless-stopped
              env_file:
                - .env
              ports:
                - "8000:8000"
              volumes:
                - ./data:/app/data
                - ./downloads:/app/downloads
                - ./ssl:/app/ssl
          EOF

          # Copy .env to deploy dir
          cp /tmp/.env ${DEPLOY_DIR}/.env
          chmod 600 ${DEPLOY_DIR}/.env

          # Pull and restart
          cd ${DEPLOY_DIR}
          docker compose pull
          docker compose up -d --remove-orphans

          # Clean old images
          docker image prune -f

          # Verify
          sleep 10
          if docker inspect --format='{{.State.Status}}' ${CONTAINER} 2>/dev/null | grep -q "running"; then
            echo "✅ Container is running!"
            docker inspect --format='{{.State.Status}}' ${CONTAINER}
            docker logs --tail=10 ${CONTAINER}
          else
            echo "❌ Container failed to start!"
            docker logs --tail=30 ${CONTAINER}
            exit 1
          fi

          echo "✅ Deployment Complete!"
          SCRIPTEOF

          scp -P 22 /tmp/.env root@${VPS_HOST}:/tmp/.env
          scp -P 22 /tmp/deploy.sh root@${VPS_HOST}:/tmp/deploy.sh
          ssh -p 22 root@${VPS_HOST} "bash /tmp/deploy.sh"
