name: Tests

# The single source of truth for testing.
# - Runs automatically on every push/PR to master
# - Callable from other workflows (release.yml)
# - Runnable manually from the Actions tab
on:
  workflow_call:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: 🧪 Test
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 📦 Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: 🧪 Run tests
        run: python -m unittest discover tests -v
